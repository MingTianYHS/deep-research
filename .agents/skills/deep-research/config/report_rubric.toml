schema_version = 3

# Hard checks only. No weighted aggregate score is used.
[gates]
minimum_citation_coverage = 0.80
minimum_numeric_citation_coverage = 0.90
minimum_independence_groups = 2
maximum_invalid_citations = 0
maximum_high_risk_citations = 0
maximum_todo_markers = 0
minimum_substantive_section_chars = 40
require_yaml_frontmatter = true

[sections]
required = ["executive", "scope", "findings", "limits", "implications", "sources"]

[section_aliases]
executive = ["executive conclusion", "executive summary", "执行摘要", "核心结论"]
scope = ["scope", "method", "范围", "方法", "调研范围与方法"]
findings = ["findings", "analysis", "supported findings", "分析", "主要发现", "核心发现"]
limits = ["conflict", "limitations", "uncertainty", "open questions", "冲突", "局限", "不确定性", "未解决", "冲突、限制与未解决问题"]
implications = ["implications", "recommendations", "启示", "建议", "决策启示与建议"]
sources = ["sources", "references", "来源", "参考资料"]
