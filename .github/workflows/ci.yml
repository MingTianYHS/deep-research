name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Unit tests
        shell: bash
        run: set -o pipefail; python scripts/run_tests_ci.py 2>&1 | tee pytest-output.txt
      - name: Report repair failure
        if: ${{ failure() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Temporary CI repair diagnostics'
            echo
            echo '```text'
            tail -n 180 pytest-output.txt
            echo '```'
          } > ci-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file ci-comment.md

  release-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Release validation
        shell: bash
        run: |
          set +e
          python .agents/skills/deep-research/scripts/releasectl.py release-check --strict 2>&1 | tee release-check-output.txt
          release_status=${PIPESTATUS[0]}
          python scripts/smoke_test.py 2>&1 | tee smoke-output.txt
          smoke_status=${PIPESTATUS[0]}
          test "$release_status" -eq 0 -a "$smoke_status" -eq 0
      - name: Report release failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Temporary release-smoke diagnostics'
            echo
            echo '**Release check**'
            echo '```text'
            tail -n 100 release-check-output.txt
            echo '```'
            echo '**Smoke test**'
            echo '```text'
            tail -n 140 smoke-output.txt
            echo '```'
          } > ci-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file ci-comment.md
